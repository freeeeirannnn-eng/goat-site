<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گوت سرور | پنل مدیریت هوشمند</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
            border: 1px solid var(--border);
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
            font-weight: 700;
            font-size: 22px;
        }

        label {
            display: block;
            margin-top: 15px;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid var(--border);
            border-radius: 10px;
            box-sizing: border-box;
            font-family: 'Vazirmatn';
            font-size: 14px;
            background: #f8fafc;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 13px;
            margin-top: 20px;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Vazirmatn';
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: var(--primary-hover); }

        .btn-danger { background: #ef4444; margin-top: 10px; }
        .btn-danger:hover { background: #dc2626; }
        .btn-warning { background: #f59e0b; color: #fff; margin-top: 10px; }
        .btn-warning:hover { background: #d97706; }
        .btn-secondary { background: #64748b; margin-top: 10px; }
        .btn-secondary:hover { background: #475569; }

        #result { margin-top: 15px; text-align: center; font-weight: 600; font-size: 13px; }
        .hidden { display: none !important; }

        .success-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            word-break: break-all;
            text-align: center;
        }

        .admin-card {
            background: #f8fafc;
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 10px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            background: #e0f2fe;
            color: #0369a1;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- صفحه لاگین -->
    <div id="loginSection">
        <h2>ورود به پنل گوت سرور</h2>
        <form onsubmit="handleLogin(event)">
            <label>نام کاربری:</label>
            <input type="text" id="loginUser" required placeholder="آیدی ادمین">

            <label>رمز عبور:</label>
            <input type="password" id="loginPass" required placeholder="رمز عبور">

            <button type="submit">ورود</button>
        </form>
        <div id="loginError" style="color: #ef4444; text-align: center; margin-top: 12px; font-size: 13px; font-weight: 600;"></div>
    </div>

    <!-- پنل اصلی مدیریت -->
    <div id="adminPanel" class="hidden">
        <h2>ساخت اشتراک جدید</h2>
        
        <form id="subForm" onsubmit="createSub(event)">
            <label>حجم (گیگابایت):</label>
            <input type="number" id="volume" required placeholder="مثال: 30">

            <label>مدت زمان (روز):</label>
            <input type="number" id="days" required placeholder="مثال: 30">

            <label>نوع پنل:</label>
            <select id="panelType">
                <option value="vip">ویژه (ربکا - VIP)</option>
                <option value="normal">عادی (یو پنل - Normal)</option>
            </select>

            <button type="submit">ایجاد اشتراک</button>
        </form>
        <div id="result"></div>
        <div id="subResultBox" class="hidden success-box"></div>

        <div style="margin-top: 25px; border-top: 1px solid var(--border); padding-top: 15px;">
            <button type="button" onclick="openAdminManager()" class="btn-warning">⚙️ مدیریت ادمین‌ها و گزارشات</button>
            <button type="button" onclick="logout()" class="btn-danger">خروج از حساب</button>
        </div>
    </div>

    <!-- بخش مدیریت ادمین‌ها -->
    <div id="subAdminManager" class="hidden">
        <h2>مدیریت ادمین‌ها و تسویه</h2>
        <div style="background: #f8fafc; padding: 15px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 15px;">
            <h4 style="margin: 0 0 10px 0; color: var(--primary); font-size: 13px;">➕ افزودن ادمین جدید</h4>
            <input type="text" id="newAdminUser" placeholder="آیدی ادمین" style="margin-bottom: 8px;">
            <input type="password" id="newAdminPass" placeholder="رمز عبور" style="margin-bottom: 8px;">
            <input type="number" id="newAdminVolume" placeholder="سهمیه حجم (GB)" style="margin-bottom: 8px;">
            <input type="number" id="newAdminDays" placeholder="سهمیه روز" style="margin-bottom: 8px;">
            <button type="button" onclick="addAdmin()" style="margin-top: 0; background: var(--primary);">ثبت ادمین</button>
        </div>

        <h3 style="font-size: 14px;">لیست ادمین‌ها</h3>
        <div id="adminsListContainer" style="max-height: 200px; overflow-y: auto;"></div>

        <button type="button" onclick="closeAdminManager()" class="btn-secondary">بازگشت</button>
    </div>
</div>

<script>
    let currentAdmin = '';

    function handleLogin(e) {
        e.preventDefault();
        const user = document.getElementById('loginUser').value;
        const pass = document.getElementById('loginPass').value;

        if (user === 'Goathszz' && pass === 'Goathszz') {
            currentAdmin = 'Goathszz';
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
        } else {
            // بررسی ادمین‌های فرعی از سرور
            verifySubAdmin(user, pass);
        }
    }

    async function verifySubAdmin(username, password) {
        try {
            const res = await fetch('/api/login-admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if(data.success) {
                currentAdmin = username;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
            } else {
                document.getElementById('loginError').innerText = '❌ اطلاعات ورود اشتباه است!';
            }
        } catch(err) {
            document.getElementById('loginError').innerText = '❌ خطا در ارتباط با سرور';
        }
    }

    function logout() { location.reload(); }

    async function createSub(e) {
        e.preventDefault();
        const volume = document.getElementById('volume').value;
        const days = document.getElementById('days').value;
        const panelType = document.getElementById('panelType').value;
        const resultDiv = document.getElementById('result');
        const subBox = document.getElementById('subResultBox');

        resultDiv.style.color = varColor('--primary');
        resultDiv.innerText = '⏳ در حال ساخت اشتراک...';
        subBox.classList.add('hidden');

        try {
            const response = await fetch('/api/create-subscription', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ volume, days, panelType, adminName: currentAdmin })
            });

            const data = await response.json();
            if (data.success) {
                resultDiv.style.color = '#16a34a';
                resultDiv.innerText = '✅ اشتراک با موفقیت ساخته شد!';
                subBox.innerHTML = `
                    <strong>نام کاربری:</strong> ${data.username}<br><br>
                    <a href="${data.subLink}" target="_blank" style="color:var(--primary); font-weight:bold;">🔗 لینک اشتراک (Sub Link)</a><br><br>
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(data.subLink)}" alt="QR Code" style="border-radius:8px;">
                `;
                subBox.classList.remove('hidden');
            } else {
                resultDiv.style.color = '#dc2626';
                resultDiv.innerText = data.error || 'خطا در ساخت اشتراک';
            }
        } catch (err) {
            resultDiv.style.color = '#dc2626';
            resultDiv.innerText = '❌ خطا در ارتباط با سرور مقصد';
        }
    }

    function varColor(name) { return '#2563eb'; }

    function openAdminManager() {
        if(currentAdmin !== 'Goathszz') {
            alert('فقط مدیر کل به این بخش دسترسی دارد!');
            return;
        }
        document.getElementById('adminPanel').classList.add('hidden');
        document.getElementById('subAdminManager').classList.remove('hidden');
        loadAdmins();
    }

    function closeAdminManager() {
        document.getElementById('subAdminManager').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
    }

    async function loadAdmins() {
        const container = document.getElementById('adminsListContainer');
        container.innerHTML = '<p style="text-align:center; color:#64748b; font-size:12px;">در حال بارگذاری...</p>';
        try {
            const res = await fetch('/api/admins');
            const data = await res.json();
            container.innerHTML = '';
            if(data.admins && data.admins.length > 0) {
                data.admins.forEach(adm => {
                    container.innerHTML += `
                        <div class="admin-card">
                            <div>
                                <strong>${adm.username}</strong><br>
                                <span class="badge">حجم: ${adm.volume}GB | روز: ${adm.days}</span>
                            </div>
                            <div>
                                <button onclick="settleAdmin('${adm.username}')" style="padding:4px 8px; font-size:11px; background:#16a34a; width:auto; margin:0;">تسویه</button>
                                <button onclick="deleteAdmin('${adm.username}')" style="padding:4px 8px; font-size:11px; background:#ef4444; width:auto; margin:2px 0 0 0;">حذف</button>
                            </div>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = '<p style="text-align:center; color:#64748b; font-size:12px;">هیچ ادمینی نیست.</p>';
            }
        } catch(e) {}
    }

    async function addAdmin() {
        const username = document.getElementById('newAdminUser').value;
        const password = document.getElementById('newAdminPass').value;
        const volume = document.getElementById('newAdminVolume').value;
        const days = document.getElementById('newAdminDays').value;
        if(!username || !password) return alert('اطلاعات کامل وارد کنید');
        const res = await fetch('/api/admins/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password, volume, days })
        });
        const data = await res.json();
        alert(data.message || 'انجام شد');
        loadAdmins();
    }

    async function deleteAdmin(username) {
        if(!confirm('حذف شود؟')) return;
        await fetch('/api/admins/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username })
        });
        loadAdmins();
    }

    async function settleAdmin(username) {
        if(!confirm('تسویه حساب و پاکسازی گزارشات؟')) return;
        await fetch('/api/admins/settle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username })
        });
        loadAdmins();
    }
</script>

</body>
</html>
