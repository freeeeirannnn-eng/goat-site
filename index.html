<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گوت سرور | پنل مدیریت هوشمند</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            border: 1px solid var(--border);
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
            font-weight: 700;
            font-size: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid var(--border);
            border-radius: 10px;
            box-sizing: border-box;
            font-family: 'Vazirmatn';
            font-size: 14px;
            background: #f8fafc;
        }

        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            margin-top: 15px;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Vazirmatn';
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: var(--primary-hover); }

        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-warning { background: #f59e0b; color: #fff; }
        .btn-warning:hover { background: #d97706; }
        .btn-success { background: #16a34a; }
        .btn-success:hover { background: #15803d; }

        .hidden { display: none !important; }

        /* استایل لیست اشتراک‌ها به سبک پنل‌های مدرن */
        .sub-item {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-top: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .sub-header {
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .sub-header:hover {
            background: #f1f5f9;
        }

        .sub-content {
            padding: 15px;
            background: #ffffff;
            border-top: 1px solid var(--border);
            display: none;
            text-align: center;
            word-break: break-all;
        }

        .sub-content.open {
            display: block;
        }

        .badge {
            background: #e0f2fe;
            color: #0369a1;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- صفحه لاگین -->
    <div id="loginSection">
        <h2>ورود به پنل گوت سرور</h2>
        <form onsubmit="handleLogin(event)">
            <label>نام کاربری:</label>
            <input type="text" id="loginUser" required placeholder="آیدی ادمین">

            <label>رمز عبور:</label>
            <input type="password" id="loginPass" required placeholder="رمز عبور">

            <button type="submit">ورود</button>
        </form>
        <div id="loginError" style="color: #ef4444; text-align: center; margin-top: 12px; font-size: 13px; font-weight: 600;"></div>
    </div>

    <!-- پنل اصلی ادمین / کاربر -->
    <div id="adminPanel" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 id="welcomeTitle" style="margin: 0; font-size: 16px; color: var(--primary);">داشبورد</h3>
            <button onclick="logout()" class="btn-danger" style="width: auto; margin: 0; padding: 6px 12px; font-size: 12px;">خروج</button>
        </div>

        <!-- دکمه ایجاد اشتراک جدید (بالای صفحه) -->
        <button onclick="openCreateModal()" class="btn-success">➕ ایجاد اشتراک جدید</button>

        <h4 style="margin: 20px 0 10px 0; font-size: 14px; color: var(--text-main);">لیست اشتراک‌های ساخته شده</h4>
        <div id="mySubsList" style="max-height: 350px; overflow-y: auto;">
            <p style="text-align: center; color: var(--text-muted); font-size: 13px;">در حال بارگذاری...</p>
        </div>
    </div>

    <!-- فرم ساخت اشتراک (به صورت بخش کشویی) -->
    <div id="createModal" class="hidden" style="background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid var(--border); margin-top: 15px;">
        <h4 style="margin: 0 0 10px 0; color: var(--primary);">ساخت اشتراک جدید</h4>
        <form onsubmit="createSub(event)">
            <label>حجم (گیگابایت):</label>
            <input type="number" id="volume" required placeholder="مثال: 30">

            <label>مدت زمان (روز):</label>
            <input type="number" id="days" required placeholder="مثال: 30">

            <label>نوع پنل:</label>
            <select id="panelType">
                <option value="vip">ویژه (ربکا - VIP)</option>
                <option value="normal">عادی (یو پنل - Normal)</option>
            </select>

            <button type="submit" class="btn-success">ثبت و ساخت نهایی</button>
            <button type="button" onclick="closeCreateModal()" class="btn-danger" style="margin-top: 8px;">انصراف</button>
        </form>
        <div id="createResult" style="text-align: center; margin-top: 10px; font-size: 13px; font-weight: 600;"></div>
    </div>
</div>

<script>
    let currentAdmin = '';

    function handleLogin(e) {
        e.preventDefault();
        const user = document.getElementById('loginUser').value;
        const pass = document.getElementById('loginPass').value;

        if (user === 'Goathszz' && pass === 'Goathszz') {
            currentAdmin = 'Goathszz';
            initDashboard();
        } else {
            verifySubAdmin(user, pass);
        }
    }

    async function verifySubAdmin(username, password) {
        try {
            const res = await fetch('/api/login-admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if(data.success) {
                currentAdmin = username;
                initDashboard();
            } else {
                document.getElementById('loginError').innerText = '❌ اطلاعات ورود اشتباه است!';
            }
        } catch(err) {
            document.getElementById('loginError').innerText = '❌ خطا در ارتباط با سرور';
        }
    }

    function initDashboard() {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        document.getElementById('welcomeTitle').innerText = `مدیر: ${currentAdmin}`;
        loadMySubs();
    }

    function logout() { location.reload(); }

    function openCreateModal() {
        document.getElementById('createModal').classList.remove('hidden');
    }

    function closeCreateModal() {
        document.getElementById('createModal').classList.add('hidden');
    }

    async function loadMySubs() {
        const container = document.getElementById('mySubsList');
        try {
            const res = await fetch(`/api/admin-reports?username=${currentAdmin}`);
            const data = await res.json();
            container.innerHTML = '';

            if(data.reports && data.reports.length > 0) {
                data.reports.forEach((sub, index) => {
                    container.innerHTML += `
                        <div class="sub-item">
                            <div class="sub-header" onclick="toggleSub(${index})">
                                <div>
                                    <strong>${sub.username}</strong><br>
                                    <span class="badge">حجم: ${sub.volume}GB | روز: ${sub.days}</span>
                                </div>
                                <span style="font-size: 12px; color: var(--text-muted);">${sub.date} 🔽</span>
                            </div>
                            <div class="sub-content" id="sub-content-${index}">
                                <p style="margin: 0 0 10px 0; font-size: 12px; color: var(--text-muted);">لینک اشتراک:</p>
                                <input type="text" value="${sub.subLink}" readonly style="font-size: 11px; text-align: center; margin-bottom: 10px;" onclick="this.select()">
                                <p style="margin: 0 0 5px 0; font-size: 12px; color: var(--text-muted);">QR Code:</p>
                                <img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=${encodeURIComponent(sub.subLink)}" alt="QR" style="border-radius: 8px;">
                            </div>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 13px;">هنوز اشتراکی نساخته‌اید.</p>';
            }
        } catch(e) {
            container.innerHTML = '<p style="text-align: center; color: red; font-size: 13px;">خطا در دریافت لیست</p>';
        }
    }

    function toggleSub(index) {
        const content = document.getElementById(`sub-content-${index}`);
        content.classList.toggle('open');
    }

    async function createSub(e) {
        e.preventDefault();
        const volume = document.getElementById('volume').value;
        const days = document.getElementById('days').value;
        const panelType = document.getElementById('panelType').value;
        const resDiv = document.getElementById('createResult');

        resDiv.style.color = 'var(--primary)';
        resDiv.innerText = '⏳ در حال ساخت...';

        try {
            const res = await fetch('/api/create-subscription', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ volume, days, panelType, adminName: currentAdmin })
            });
            const data = await res.json();
            if(data.success) {
                resDiv.style.color = '#16a34a';
                resDiv.innerText = '✅ با موفقیت ساخته شد!';
                closeCreateModal();
                loadMySubs();
            } else {
                resDiv.style.color = '#ef4444';
                resDiv.innerText = data.error || 'خطا';
            }
        } catch(err) {
            resDiv.style.color = '#ef4444';
            resDiv.innerText = 'خطا در ارتباط';
        }
    }
</script>

</body>
</html>
